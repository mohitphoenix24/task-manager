services:
  server:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN}
      PORT: 4000
    ports:
      - "127.0.0.1:4000:4000"

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "127.0.0.1:8080:80"
